version: '3.7'

services:
  heimdall:
    image: thefatredcat/heimdall:1.3.0
    build:
      target: release
    # Replace the dev volumes entirely: no source bind-mount (the image ships
    # the built front + server), only the docker socket.
    volumes: !override
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      APP_MODE: release
      DOCKER_HOST: "unix:///var/run/docker.sock"
      DOCKER_API_URL: "/docker/"
